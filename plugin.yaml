name: memrack
capabilities: [tools.override]   # mounts memrack_search/write/status/import/dock/card_review/vec_add (no overrides of builtin tools!)
version: 0.11.1
pip_dependencies:   # optional semantic-recall deps: PM installs them into Hermes' environment (the vec probe stays honest without them)
  - sqlite-vec>=0.1.9
  - pypdf>=4.0   # pdf ingest only; absent = fail loud with an install hint (no silent degradation)
description: "memrack — one provider slot, many memory backends: agent-routed writes over dockable cards, fan-out retrieval with RRF merge, bridge-style manifest docking (parallel hook fan-out with per-backend timeout, transcript gating by card decision); the uninstall grace keeps the rack and its store switches consistent (a parked card's config switch flips off, a restored card stays switched off until re-enabled)."
author: Kesuek
license: MIT
hooks:
  - on_session_end
  - on_memory_write
